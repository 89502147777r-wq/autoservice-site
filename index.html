<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Кругосветка по английскому</title>
<meta name="theme-color" content="#2446C8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #EEF2FF; --card: #FFFFFF; --ink: #141B4D; --muted: #5B6390; --line: #D5DBF5;
  --blue: #2446C8; --blue-soft: #DCE3FF; --red: #E0413A; --gold: #F2B33D; --gold-ink: #6B4A00;
  --mint: #139A63; --mint-soft: #D6F5E6; --err: #D63B4A; --err-soft: #FDE1E4; --on-blue: #FFFFFF;
  --shadow: 0 10px 30px rgba(20, 27, 77, 0.12);
  --blob1: #BFCBFF; --blob2: #FFD2CF; --blob3: #FFE7B3;
  --font-ui: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-word: "Fraunces", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1233; --card: #18214F; --ink: #EEF1FF; --muted: #A3AAD6; --line: #2A3470;
    --blue: #5B7BFF; --blue-soft: #222C66; --red: #FF5A52; --gold: #F5C25A; --gold-ink: #3A2800;
    --mint: #2FC98A; --mint-soft: #123D32; --err: #FF6B78; --err-soft: #3D1522;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35); --blob1: #26307A; --blob2: #4A1F3A; --blob3: #3A3313;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1233; --card: #18214F; --ink: #EEF1FF; --muted: #A3AAD6; --line: #2A3470;
  --blue: #5B7BFF; --blue-soft: #222C66; --red: #FF5A52; --gold: #F5C25A; --gold-ink: #3A2800;
  --mint: #2FC98A; --mint-soft: #123D32; --err: #FF6B78; --err-soft: #3D1522;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35); --blob1: #26307A; --blob2: #4A1F3A; --blob3: #3A3313;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 10px; }
h1, h2, h3, p { margin: 0; }

.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
.blob { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(60px); opacity: 0.55; }
.b1 { background: var(--blob1); top: -25vmax; left: -20vmax; animation: drift1 26s ease-in-out infinite alternate; }
.b2 { background: var(--blob2); bottom: -30vmax; right: -25vmax; animation: drift2 30s ease-in-out infinite alternate; }
.b3 { background: var(--blob3); top: 30%; left: 40%; width: 35vmax; height: 35vmax; opacity: 0.35; animation: drift3 22s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(12vmax, 10vmax) scale(1.1); } }
@keyframes drift2 { to { transform: translate(-10vmax, -12vmax) scale(1.15); } }
@keyframes drift3 { to { transform: translate(-15vmax, 8vmax); } }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: 16px 16px 120px; }
.screen { animation: enter 0.28s ease-out both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.airmail { padding: 7px; border-radius: 22px; box-shadow: var(--shadow);
  background: repeating-linear-gradient(135deg, var(--red) 0 12px, var(--card) 12px 19px, var(--blue) 19px 31px, var(--card) 31px 38px); }
.airmail > .inner { background: var(--card); border-radius: 16px; height: 100%; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 12px 20px;
  border-radius: 16px; background: var(--blue); color: var(--on-blue); font-weight: 700; font-size: 17px;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--blue) 70%, #000); transition: transform 0.08s, box-shadow 0.08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--blue) 70%, #000); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn.quiet { background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 65%, #000); }
.btn.mint { background: var(--mint); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--mint) 65%, #000); }
.btn.err { background: var(--err); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--err) 65%, #000); }
.link { color: var(--blue); font-weight: 500; padding: 10px; display: block; margin: 8px auto 0; }
.stack { display: grid; gap: 10px; }

/* заставка */
#splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--blue); transition: opacity 0.4s, visibility 0.4s; cursor: pointer; }
#splash.out { opacity: 0; visibility: hidden; }
.env { position: relative; width: 250px; height: 164px; perspective: 700px; }
.env-body { position: absolute; inset: 0; border-radius: 12px; padding: 8px; animation: envIn 0.5s cubic-bezier(.2,.9,.3,1.3) both;
  background: repeating-linear-gradient(135deg, #E0413A 0 12px, #fff 12px 19px, #16299A 19px 31px, #fff 31px 38px); }
.env-body::after { content: ""; position: absolute; inset: 8px; background: #fff; border-radius: 6px; }
.env-flap { position: absolute; left: 8px; right: 8px; top: 8px; height: 90px; z-index: 3; background: #F4F6FF;
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; animation: flap 0.5s 0.55s ease-in both; }
.env-letter { position: absolute; left: 22px; right: 22px; top: 30px; height: 112px; z-index: 2; background: #fff; border-radius: 8px;
  display: grid; place-items: center; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.18); animation: letterUp 0.6s 1s cubic-bezier(.2,.9,.3,1.2) both; }
.env-letter b { font-size: 27px; font-weight: 800; color: #16299A; line-height: 1; letter-spacing: -0.01em; }
.env-letter span { display: block; margin-top: 6px; font-family: var(--font-word); font-size: 15px; color: #5B6390; }
.env-front { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 104px; z-index: 4; border-radius: 0 0 6px 6px;
  background: linear-gradient(180deg, #E6EBFF, #FFFFFF 70%); clip-path: polygon(0 30%, 50% 70%, 100% 30%, 100% 100%, 0 100%); }
@keyframes envIn { from { transform: scale(.4) rotate(-12deg); opacity: 0; } }
@keyframes flap { to { transform: rotateX(180deg); z-index: 1; } }
@keyframes letterUp { to { transform: translateY(-80px) rotate(-3deg); z-index: 5; } }

/* шапка */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.hello { flex: 1; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--card); font-weight: 700; font-size: 15px; box-shadow: var(--shadow); }
.chip svg { width: 18px; height: 18px; }
.chip.off { color: var(--muted); }

/* сцены стран */
.scene { display: block; width: 100%; height: auto; border-radius: 16px; background: #9DB3E0; }
.scene .cloud { animation: cloud 38s linear infinite; }
.scene .cloud.c2 { animation-duration: 55s; animation-delay: -20s; }
@keyframes cloud { from { transform: translateX(-120px); } to { transform: translateX(420px); } }
.scene .bus { animation: bus 12s linear infinite; }
@keyframes bus { from { transform: translateX(-90px); } to { transform: translateX(400px); } }
.scene .bus .wheel { animation: bounce 0.35s ease-in-out infinite alternate; }
@keyframes bounce { to { transform: translateY(-0.8px); } }
.scene .rain { animation: rainCycle 16s linear infinite; }
.scene .rain line { animation: fall 0.8s linear infinite; }
.scene .rain line:nth-child(3n) { animation-delay: -0.3s; }
.scene .rain line:nth-child(3n+1) { animation-delay: -0.55s; }
@keyframes fall { from { transform: translate(0, -24px); } to { transform: translate(-6px, 24px); } }
@keyframes rainCycle { 0%, 45% { opacity: 0; } 55%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
.scene .wave { animation: wave 5s ease-in-out infinite alternate; }
@keyframes wave { to { transform: translateX(-14px); } }
.scene .clockhand { transform-origin: 275px 80px; animation: tick 60s linear infinite; }
@keyframes tick { to { transform: rotate(360deg); } }

.country { margin-bottom: 16px; }
.country .inner { padding: 12px 12px 16px; }
.country .cap { display: flex; align-items: baseline; gap: 8px; margin: 12px 4px 2px; }
.country .cap b { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.country .cap span { color: var(--muted); font-size: 14px; }
.country .sub { color: var(--muted); font-size: 14px; margin: 0 4px 12px; }
.progress-line { height: 10px; border-radius: 5px; background: var(--blue-soft); overflow: hidden; margin: 0 4px 14px; }
.progress-line i { display: block; height: 100%; background: var(--gold); border-radius: 5px; transition: width .5s; }

.goal { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); margin-bottom: 14px; }
.ring { width: 48px; height: 48px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: var(--blue-soft); }
.ring .val { stroke: var(--gold); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.8s ease; }
.goal b { display: block; font-size: 16px; }
.goal span { color: var(--muted); font-size: 14px; }

.review { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 18px; background: var(--gold); color: var(--gold-ink);
  font-weight: 700; margin-bottom: 16px; text-align: left; box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 65%, #000); }
.review small { display: block; font-weight: 500; opacity: 0.85; }
.review .n { margin-left: auto; font-size: 24px; font-weight: 800; }

/* маршрут */
.section-t { font-weight: 800; font-size: 18px; margin: 22px 0 10px; }
.route { position: relative; display: grid; gap: 8px; }
.route::before { content: ""; position: absolute; left: 27px; top: 20px; bottom: 20px; border-left: 3px dashed var(--line); }
.stop { position: relative; display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 4px; border-radius: 18px; text-align: left; }
.stop .dot { position: relative; z-index: 1; flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); border: 3px solid var(--line); font-weight: 800; color: var(--muted); }
.stop b { display: block; font-size: 16px; line-height: 1.25; }
.stop small { color: var(--muted); font-size: 13px; }
.stop.done .dot { background: var(--mint); border-color: var(--mint); color: #fff; }
.stop.current { background: var(--card); box-shadow: var(--shadow); }
.stop.current .dot { background: var(--blue); border-color: var(--blue); color: #fff; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--blue) 20%, transparent); } }
.stop.customs .dot { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-size: 22px; }
.stop.locked { opacity: 0.55; }
.stop.locked .dot { font-size: 18px; }

.next-countries { display: grid; gap: 10px; }
.nc { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
.nc .flag { font-size: 34px; line-height: 1; filter: saturate(0.6); }
.nc b { display: block; }
.nc span { color: var(--muted); font-size: 14px; }
.nc .soon { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); border: 2px dashed var(--line); border-radius: 10px; padding: 4px 8px; white-space: nowrap; }

/* нижнее меню */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.nav div { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; border-radius: 14px; color: var(--muted); font-size: 13px; font-weight: 500; }
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--blue); background: var(--blue-soft); }

/* знакомство и тест */
.ob { min-height: calc(100vh - 140px); display: flex; flex-direction: column; }
.ob h1 { font-size: 31px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin: 20px 0 10px; }
.ob p.lead { color: var(--muted); font-size: 17px; margin-bottom: 20px; }
.ob .grow { flex: 1; }
.flags { display: flex; justify-content: space-between; margin: 14px 2px 0; font-size: 30px; }
.flags span { animation: hop 2.4s ease-in-out infinite; }
.flags span:nth-child(2) { animation-delay: .2s; } .flags span:nth-child(3) { animation-delay: .4s; }
.flags span:nth-child(4) { animation-delay: .6s; } .flags span:nth-child(5) { animation-delay: .8s; } .flags span:nth-child(6) { animation-delay: 1s; }
@keyframes hop { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-6px); } }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.facts div { background: var(--card); border-radius: 16px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
.facts b { display: block; font-size: 26px; font-weight: 800; color: var(--blue); line-height: 1.1; }
.facts span { font-size: 13px; color: var(--muted); }
.choices { display: grid; gap: 10px; margin-bottom: 20px; }
.choice { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; background: var(--card); border: 2px solid var(--line); text-align: left; }
.choice b { display: block; font-size: 17px; }
.choice span { color: var(--muted); font-size: 14px; }
.choice .badge { flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; background: var(--blue-soft); color: var(--blue); }
.choice[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 8px; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.on { width: 22px; background: var(--blue); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* урок */
.lesson-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.x { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex: none; }
.x svg { width: 24px; height: 24px; }
.bar { flex: 1; height: 14px; border-radius: 7px; background: var(--blue-soft); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 7px; background: var(--mint); transition: width 0.35s ease; position: relative; }
.bar i::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.4); }
.combo { font-weight: 800; color: var(--gold); font-size: 15px; min-width: 40px; text-align: right; }
.step-t { color: var(--muted); font-weight: 500; margin-bottom: 12px; }
.stage { min-height: 300px; }

.scene-wrap { position: relative; border-radius: 16px; overflow: hidden; }
.scene-wrap .scene { display: block; }
.scene-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scene-intro h2 { font-size: 26px; font-weight: 800; margin: 16px 0 6px; letter-spacing: -0.01em; }
.scene-intro p { color: var(--muted); font-size: 17px; margin-bottom: 20px; }
.plan { display: grid; gap: 8px; margin-bottom: 20px; }
.plan div { display: flex; gap: 10px; align-items: center; font-weight: 500; }
.plan i { width: 28px; height: 28px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); font-style: normal; font-weight: 800; font-size: 14px; }

.known-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 22px; }
.known-list span { padding: 7px 12px; border-radius: 999px; background: var(--mint-soft); color: var(--mint); font-family: var(--font-word); font-weight: 700; font-size: 18px; }

.card3d { position: relative; height: 330px; perspective: 1200px; cursor: pointer; margin-bottom: 20px; }
.card3d .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform 0.55s cubic-bezier(.3,.8,.3,1); }
.card3d .back { transform: rotateY(180deg); }
.card3d.is-flipped .front { transform: rotateY(-180deg); }
.card3d.is-flipped .back { transform: rotateY(0deg); }
.card3d .inner { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px; position: relative; }
.word { font-family: var(--font-word); font-weight: 700; font-size: clamp(36px, 11vw, 50px); line-height: 1.05; overflow-wrap: anywhere; }
.ipa { color: var(--muted); font-size: 17px; margin-top: 8px; }
.flip-hint { color: var(--muted); font-size: 14px; margin-top: 18px; }
.ru { font-size: 28px; font-weight: 800; line-height: 1.15; }
.ex { font-family: var(--font-word); font-size: 21px; font-weight: 600; margin-top: 18px; line-height: 1.3; }
.exru { color: var(--muted); margin-top: 6px; }
.postmark { position: absolute; top: 14px; right: 14px; width: 58px; height: 58px; border-radius: 50%; border: 2px dashed var(--red); color: var(--red);
  display: grid; place-content: center; font-size: 22px; transform: rotate(14deg); opacity: 0.75; }
.speak { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--blue) 70%, #000); flex: none; }
.speak svg { width: 26px; height: 26px; }
.speak.corner { position: absolute; top: 16px; left: 16px; width: 50px; height: 50px; }
.speak.small { width: 40px; height: 40px; }
.speak.small svg { width: 20px; height: 20px; }
.speak.big { width: 96px; height: 96px; margin: 10px auto 24px; }
.speak.big svg { width: 44px; height: 44px; }

.phrases { display: grid; gap: 12px; margin-bottom: 20px; }
.phrase { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
.phrase b { display: block; font-family: var(--font-word); font-size: 21px; font-weight: 700; line-height: 1.25; }
.phrase span { color: var(--muted); }

.chat { display: grid; gap: 10px; margin-bottom: 16px; }
.bubble { max-width: 86%; padding: 12px 14px; border-radius: 18px; animation: pop .25s ease-out both; }
.bubble.them { background: var(--card); box-shadow: var(--shadow); border-bottom-left-radius: 6px; justify-self: start; }
.bubble.me { background: var(--blue); color: #fff; border-bottom-right-radius: 6px; justify-self: end; }
.bubble .who { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.bubble .en { font-family: var(--font-word); font-size: 19px; font-weight: 600; line-height: 1.3; }
.bubble .tr { font-size: 14px; color: var(--muted); margin-top: 4px; }
.hint { color: var(--err); font-weight: 500; margin: -4px 0 10px; }

.q-word { font-family: var(--font-word); font-weight: 700; font-size: 40px; line-height: 1.1; text-align: center; margin: 6px 0 4px; overflow-wrap: anywhere; }
.q-ru { font-weight: 800; font-size: 28px; text-align: center; margin: 6px 0 4px; line-height: 1.2; }
.q-sub { text-align: center; color: var(--muted); margin-bottom: 18px; min-height: 1.4em; }
.q-sentence { font-family: var(--font-word); font-weight: 600; font-size: 24px; line-height: 1.35; text-align: center; margin: 10px 0 6px; }
.q-sentence .gap { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--blue); color: var(--blue); }
.options { display: grid; gap: 10px; }
.opt { padding: 15px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); font-size: 18px; font-weight: 500; text-align: center; transition: border-color .15s, background .15s; }
.opt.en { font-family: var(--font-word); font-weight: 600; font-size: 20px; }
.opt.right { border-color: var(--mint); background: var(--mint-soft); box-shadow: 0 3px 0 var(--mint); animation: pop 0.3s; }
.opt.wrong { border-color: var(--err); background: var(--err-soft); box-shadow: 0 3px 0 var(--err); animation: shake 0.4s; }
.opt[disabled] { pointer-events: none; }
@keyframes pop { 50% { transform: scale(1.04); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0 24px; min-height: 52px; }

/* ================= Экраны ================= */
var app = document.getElementById("app"), overlay = document.getElementById("overlay");

var obStep = 0, session = null, result = null, dialog = null, test = null;

function render() {

  else if (view === "ob") h = renderOnboarding();
  else if (view === "passport") h = renderPassport() + renderNav();

}
function renderNav() {
  return '<nav class="nav" aria-label="Разделы"><div>' +

function topBar(pct, right) {

      '<div class="facts"><div><b>60</b><span>дней</span></div><div><b>60</b><span>ситуаций</span></div><div><b>500</b><span>слов</span></div></div>' +

      goals.map(function (g) { return '<button class="choice" data-a="ob-goal" data-v="' + g[0] + '" aria-pressed="' + (state.goal === g[0]) + '"><span class="badge">' + g[0] + "</span><span><b>" + g[1] + "</b><span>" + g[2] + "</span></span></button>"; }).join("") +
      "</div></div>" + dots + '<button class="btn" data-a="ob-next">Дальше</button></div>';
  }

    dots + '<div class="stack"><button class="btn" data-a="test-start">Пройти тест</button><button class="btn quiet" data-a="test-skip">Начать с нуля</button></div></div>';

/* ---------- тест уровня ---------- */
function startTest() { test = { i: 0, knownEn: [], phase: "ask", options: null, picked: null, done: false }; render(); }
function renderTest() {
  var item = C.placement[test.i];
  var pct = Math.round(test.i / C.placement.length * 100);
  var h = topBar(pct, (test.i + 1) + "/" + C.placement.length) + '<div class="test-word">' + esc(item[0]) + "</div>";
  if (test.phase === "ask") {
    h += '<p class="test-q">Знаете это слово?</p><div class="two"><button class="btn quiet" data-a="t-no">Не знаю</button><button class="btn" data-a="t-yes">Знаю</button></div>';
  } else {
    h += '<p class="test-q">Выберите перевод</p><div class="options">' + test.options.map(function (o, i) {
      var cls = "opt";
      if (test.picked !== null) { if (o === item[1]) cls += " right"; else if (i === test.picked) cls += " wrong"; }
      return '<button class="' + cls + '" data-a="t-pick" data-v="' + i + '"' + (test.picked !== null ? " disabled" : "") + ">" + esc(o) + "</button>";
    }).join("") + "</div>";
  }
  return h;
}
function testNext() {
  test.i++; test.phase = "ask"; test.options = null; test.picked = null;
  if (test.i >= C.placement.length) finishTest(); else render();
}
function finishTest() {
  var k = test.knownEn.length, d = dayNum();
  test.knownEn.forEach(function (en) { if (WORDS[en]) state.words[en] = { b: 2, d: d + INTERVALS[2] }; });
  var label = k <= 6 ? "Начинаем с основ" : k <= 13 ? "Школьная база есть" : "Уверенная база";
  state.placed = { k: k, label: label };
  state.onboarded = true; save();
  test.done = true; render();
}
function renderTestResult() {
  var p = state.placed;
  var lead = p.k <= 6 ? "Хорошее начало. Пройдём маршрут с самых нужных слов и фраз." :
    p.k <= 13 ? "Основа со школы на месте. Знакомые слова уже отмечены, в уроках на них не придётся тратить время." :
    "Вы знаете много слов. Первая страна пройдёт быстро, самое интересное начнётся дальше по маршруту.";
  return '<div class="result"><div style="font-size:60px;line-height:1" aria-hidden="true">🧳</div><h1>' + esc(p.label) + '</h1><p class="lead">' + lead + "</p>" +
    '<div class="stats"><div class="stat blue"><b>' + p.k + '</b><span>из 20 слов знаете</span></div><div class="stat mint"><b>' + learnedCount() + "</b><span>" + plural(learnedCount(), "слово", "слова", "слов") + ' маршрута отмечено</span></div><div class="stat gold"><b>🇬🇧</b><span>первая страна</span></div></div>' +
    '<button class="btn" data-a="test-done">К маршруту</button></div>';
}

/* ---------- карта маршрута ---------- */
function ringSvg(v, max) {

}
function renderMap() {

    (tx >= state.goal ? "Серия продлена, можно продолжать" : "Осталось " + (state.goal - tx) + " " + plural(state.goal - tx, "очко", "очка", "очков")) + "</span></div></div>";
  h += '<article class="airmail country"><div class="inner">' + sceneUK() + '<div class="cap"><b>' + UK.flag + " " + UK.name + "</b><span>" + UK.city + '</span></div><div class="sub">' + UK.theme + ". Пройдено " + n + " из 10 ситуаций</div>" +

          : state.visas.uk ? '<button class="btn quiet" disabled>Виза получена, следующая страна скоро</button>'

  if (due.length) h += '<button class="review" data-a="review"><span>Повторить слова<small>Пора освежить, пока не забылись</small></span><span class="n">' + Math.min(due.length, 12) + "</span></button>";
  h += '<h3 class="section-t">Маршрут по Великобритании</h3><div class="route">';
  UK.situations.forEach(function (st) {
    var done = st.id in state.sit, cur = next && next.id === st.id;
    h += '<button class="stop' + (done ? " done" : "") + (cur ? " current" : "") + '" data-a="sit" data-v="' + st.id + '"><span class="dot">' + (done ? I.check : st.index + 1) + "</span><span><b>" + esc(st.title) +
      "</b><small>" + (done ? "Пройдено, точность " + state.sit[st.id].best + "%" : cur ? "Следующая остановка" : "8 слов, 3 фразы, диалог") + "</small></span></button>";
  });
  var allDone = n === 10;
  h += '<button class="stop customs' + (allDone ? "" : " locked") + '" data-a="customs"' + (allDone ? "" : " disabled") + '><span class="dot">' + (state.visas.uk ? "✓" : "🛂") + "</span><span><b>Таможня</b><small>" +

/* ---------- паспорт ---------- */

function renderPassport() {

  return h;

/* ================= Ситуация ================= */
function startSit(id) {
  var s = sitById(id);
  var learn = s.words.filter(function (w) { return !known(w.en); });
  session = { kind: "sit", sit: s, phase: "scene", learn: learn, knownWords: s.words.filter(function (w) { return known(w.en); }), idx: 0, flipped: false, dstep: 0, dlog: [], dwrong: false };
  haptic(); render(); window.scrollTo(0, 0);
}
function startCustoms() {
  var d = dayNum();
  if (state.customsTry.uk === d && !state.visas.uk) { dialog = { kind: "info", title: "Таможня откроется завтра", text: "Сегодня попытка уже была. Повторите слова, и завтра попробуйте снова." }; renderOverlay(); return; }
  var words = pick(ALL_WORDS, 10), phrases = pick(Object.keys(PHRASES).map(function (k) { return PHRASES[k]; }), 5);
  session = { kind: "customs", phase: "scene", words: words };
  session.items = shuffle(buildItems(words, false).concat(phrases.map(function (p) { return prep({ p: p, type: "order" }); })));
  resetQuiz(); haptic(); render();
}
function startReview() {
  var due = pick(dueWords(), 12).map(function (k) { return WORDS[k]; });
  if (!due.length) return;
  session = { kind: "review", phase: "quiz", words: due, items: buildItems(due, false) };
  resetQuiz(); haptic(); render(); autoSpeak();
}
function resetQuiz() { Object.assign(session, { i: 0, correct: 0, answered: 0, xp: 0, combo: 0, best: 0, wrong: {}, retried: {} }); }

function sitSteps() {
  var st = ["scene"];
  if (session.knownWords.length) st.push("known");
  if (session.learn.length) st.push("learn");
  st.push("phrases", "dialog", "quiz");
  return st;
}
function goNextPhase() {
  var st = sitSteps(), i = st.indexOf(session.phase);
  session.phase = st[i + 1];
  if (session.phase === "quiz") {
    session.items = shuffle(buildItems(session.sit.words, false).concat(session.sit.phrases.map(function (p) { return prep({ p: p, type: "order" }); })));
    spreadSame(session.items);
    resetQuiz();
  }
  if (session.phase === "learn") { session.idx = 0; session.flipped = false; speak(session.learn[0].en); }
  render(); window.scrollTo(0, 0); autoSpeak();
}
function phasePct() {
  var st = sitSteps(), i = st.indexOf(session.phase);
  if (session.phase === "quiz") return Math.round((st.length - 1) / st.length * 100 * 0 + 60 + session.i / session.items.length * 40);
  if (session.phase === "learn") return Math.round(i / st.length * 60 + session.idx / session.learn.length * (60 / st.length));
  return Math.round(i / st.length * 60);
}

function renderSession() {
  var s = session;
  if (s.kind === "customs" && s.phase === "scene") {
    return topBar(0) + '<div class="scene-intro"><div style="font-size:64px;text-align:center" aria-hidden="true">🛂</div><h2>Таможня Великобритании</h2><p>15 заданий по словам и фразам страны. Чтобы получить визу, нужно ответить верно хотя бы на 12. Ошибки здесь не возвращаются, как на настоящем экзамене.</p></div><button class="btn gold" data-a="customs-go">Начать проверку</button>';
  }
  if (s.phase === "quiz") return renderQuiz();
  var sit = s.sit, h = topBar(phasePct(), (sit.index + 1) + "/10");
  if (s.phase === "scene") {
    h += '<div class="scene-intro">' + sceneArt(sit) + "<h2>" + esc(sit.title) + "</h2><p>" + esc(sit.scene) + "</p>" +
      '<div class="plan">' + (s.learn.length ? "<div><i>1</i>" + s.learn.length + " " + plural(s.learn.length, "новое слово", "новых слова", "новых слов") + "</div>" : "<div><i>1</i>Все слова этой ситуации вы уже знаете</div>") +
      "<div><i>2</i>3 фразы на каждый день</div><div><i>3</i>Разговор: " + esc(sit.npc) + "</div><div><i>4</i>Задания на закрепление</div></div></div>" +
      '<button class="btn" data-a="next-phase">Поехали</button>';
  } else if (s.phase === "known") {
    h += '<p class="step-t">Эти слова вы уже знаете, повторять не будем</p><div class="known-list">' + s.knownWords.map(function (w) { return "<span>" + esc(w.en) + "</span>"; }).join("") + "</div>" +
      '<button class="btn" data-a="next-phase">' + (s.learn.length ? "К новым словам" : "К фразам") + "</button>";
  } else if (s.phase === "learn") {
    var w = s.learn[s.idx];
    h += '<p class="step-t">Новое слово ' + (s.idx + 1) + " из " + s.learn.length + "</p>" +
      '<div class="card3d' + (s.flipped ? " is-flipped" : "") + '" data-a="flip" role="button" tabindex="0" aria-label="Перевернуть открытку">' +
        '<div class="face front airmail"><div class="inner"><span class="postmark" aria-hidden="true">' + UK.flag + "</span>" +
          (TTS ? '<button class="speak corner" data-a="speak" data-v="' + esc(w.en) + '" aria-label="Послушать слово">' + I.speaker + "</button>" : "") +
          '<div class="word">' + esc(w.en) + '</div><div class="ipa">/' + esc(w.ipa) + '/</div><div class="flip-hint">Нажмите, чтобы увидеть перевод</div></div></div>' +
        '<div class="face back airmail"><div class="inner">' + (TTS ? '<button class="speak corner" data-a="speak" data-v="' + esc(w.ex) + '" aria-label="Послушать пример">' + I.speaker + "</button>" : "") +
          '<div class="ru">' + esc(w.ru) + '</div><p class="ex">' + esc(w.ex) + '</p><p class="exru">' + esc(w.exRu) + "</p></div></div></div>" +
      '<button class="btn" data-a="learn-next">' + (s.idx + 1 < s.learn.length ? "Следующее слово" : "К фразам") + "</button>";
  } else if (s.phase === "phrases") {
    h += '<p class="step-t">Три фразы для этой ситуации</p><div class="phrases">' + sit.phrases.map(function (p) {
      return '<div class="phrase">' + (TTS ? '<button class="speak small" data-a="speak" data-v="' + esc(p.en) + '" aria-label="Послушать фразу">' + I.speaker + "</button>" : "") + "<div><b>" + esc(p.en) + "</b><span>" + esc(p.ru) + "</span></div></div>";
    }).join("") + '</div><button class="btn" data-a="next-phase">К разговору</button>';
  } else if (s.phase === "dialog") {
    h += '<p class="step-t">Разговор. Выберите подходящий ответ</p><div class="chat">';
    for (var k = 0; k <= Math.min(s.dstep, sit.dialog.length - 1); k++) {
      var line = sit.dialog[k];
      h += '<div class="bubble them"><div class="who">' + esc(sit.npc) + '</div><div class="en">' + esc(line.say) + '</div><div class="tr">' + esc(line.ru) + "</div></div>";
      if (s.dlog[k]) h += '<div class="bubble me"><div class="en">' + esc(s.dlog[k]) + "</div></div>";
    }
    h += "</div>";
    if (s.dstep < sit.dialog.length) {
      var cur = sit.dialog[s.dstep];
      if (!s.dopts) s.dopts = shuffle(cur.options);
      if (s.dwrong) h += '<p class="hint">Не подходит по смыслу. Прочитайте реплику ещё раз.</p>';
      h += '<div class="options">' + s.dopts.map(function (o, i) { return '<button class="opt en' + (s.dwrongIdx === i ? " wrong" : "") + '" data-a="d-pick" data-v="' + i + '">' + esc(o) + "</button>"; }).join("") + "</div>";
    } else {
      h += '<button class="btn mint" data-a="next-phase">Отлично! К заданиям</button>';
    }
  }
  return h;
}

/* ---------- задания ---------- */
var TYPES = ["choose_ru", "choose_en", "listen", "gap", "spell"];
function buildItems(words) {
  var types = TYPES.filter(function (t) { return TTS || t !== "listen"; });
  var off = Math.floor(Math.random() * types.length);
  return words.map(function (w, i) { return prep({ w: w, type: types[(i + off) % types.length] }); });
}
function spreadSame(items) {
  for (var k = 1; k < items.length; k++) {
    var a = items[k].w || items[k].p, b = items[k - 1].w || items[k - 1].p;
    if (a === b) for (var m = k + 1; m < items.length; m++) { var c = items[m].w || items[m].p; if (c !== b) { var t = items[k]; items[k] = items[m]; items[m] = t; break; } }
  }
}
function distract(w, field, n) {
  var seen = {}, out = [];
  shuffle(ALL_WORDS).forEach(function (x) { if (out.length < n && x.en !== w.en && x[field] !== w[field] && !seen[x[field]]) { seen[x[field]] = 1; out.push(x[field]); } });
  return out;
}
function prep(it) {
  it.answered = null;
  if (it.type === "order") {
    var toks = it.p.en.split(" "), sh = shuffle(toks), n = 0;
    while (sh.join(" ") === it.p.en && n++ < 10 && toks.length > 1) sh = shuffle(toks);
    it.tokens = sh; it.picked = [];
    return it;
  }
  var w = it.w;
  if (it.type === "choose_ru") it.options = shuffle([w.ru].concat(distract(w, "ru", 3)));
  else if (it.type !== "spell") it.options = shuffle([w.en].concat(distract(w, "en", 3)));
  if (it.type === "gap") it.sentence = w.ex.replace(new RegExp("\\b" + w.en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), "\u0000");
  if (it.type === "spell") {
    var letters = w.en.split(""), tl = shuffle(letters), tr = 0;
    while (tl.join("") === w.en && tr++ < 10 && letters.length > 1) tl = shuffle(letters);
    it.tiles = tl; it.picked = [];
  }
  return it;
}
function renderQuiz() {
  var s = session, q = s.items[s.i], pct = s.kind === "sit" ? phasePct() : Math.round(s.i / s.items.length * 100);
  var h = topBar(pct, s.combo >= 3 ? "×" + s.combo : (s.kind === "customs" ? (s.i + 1) + "/" + s.items.length : "")) + '<div class="stage">';
  var answered = q.answered !== null;
  function opts(isEn, correct) {
    return '<div class="options">' + q.options.map(function (o, i) {
      var cls = "opt" + (isEn ? " en" : "");
      if (answered) { if (o === correct) cls += " right"; else if (i === q.answered) cls += " wrong"; }
      return '<button class="' + cls + '" data-a="opt" data-v="' + i + '"' + (answered ? " disabled" : "") + ">" + esc(o) + "</button>";
    }).join("") + "</div>";
  }
  if (q.type === "order") {
    var p = q.p, cls = "built" + (answered ? (q.answered ? " right" : " wrong") : "");
    h += '<p class="step-t">Соберите фразу</p><div class="q-ru" style="font-size:24px">' + esc(p.ru) + '</div><div class="' + cls + '">' +
      q.picked.map(function (ti, k) { return '<button class="tile w" data-a="o-slot" data-v="' + k + '"' + (answered ? " disabled" : "") + ">" + esc(q.tokens[ti]) + "</button>"; }).join("") +
      '</div><div class="tiles">' + q.tokens.map(function (t, i) { var used = q.picked.indexOf(i) >= 0; return '<button class="tile w' + (used ? " used" : "") + '" data-a="o-tile" data-v="' + i + '"' + (used || answered ? " disabled" : "") + ">" + esc(t) + "</button>"; }).join("") + "</div>";
  } else {
    var w = q.w;
    if (q.type === "choose_ru") {
      h += '<p class="step-t">Выберите перевод</p><div class="q-word">' + esc(w.en) + '</div><div class="q-sub">/' + esc(w.ipa) + "/</div>" + opts(false, w.ru);
    } else if (q.type === "choose_en") {
      h += '<p class="step-t">Как это по-английски?</p><div class="q-ru">' + esc(w.ru) + '</div><div class="q-sub"></div>' + opts(true, w.en);
    } else if (q.type === "listen") {
      h += '<p class="step-t">Что вы услышали?</p><button class="speak big" data-a="speak" data-v="' + esc(w.en) + '" aria-label="Послушать ещё раз">' + I.speaker + "</button>" + opts(true, w.en);
    } else if (q.type === "gap") {
      var parts = q.sentence.split("\u0000");
      h += '<p class="step-t">Вставьте пропущенное слово</p><div class="q-sentence">' + esc(parts[0]) + '<span class="gap">' + (answered ? esc(q.options[q.answered]) : "&nbsp;") + "</span>" + esc(parts[1] || "") +
        '</div><div class="q-sub">' + esc(w.exRu) + "</div>" + opts(true, w.en);
    } else if (q.type === "spell") {
      var sc = "slots" + (answered ? (q.answered ? " right" : " wrong") : "");
      h += '<p class="step-t">Соберите слово из букв</p><div class="q-ru">' + esc(w.ru) + '</div><div class="q-sub"></div><div class="' + sc + '">' +
        w.en.split("").map(function (_, i) { var t = q.picked[i]; return '<button class="slot' + (t != null ? " filled" : "") + '" data-a="slot" data-v="' + i + '"' + (answered || t == null ? " disabled" : "") + ">" + (t != null ? esc(q.tiles[t]) : "") + "</button>"; }).join("") +
        '</div><div class="tiles">' + q.tiles.map(function (ch, i) { var used = q.picked.indexOf(i) >= 0; return '<button class="tile' + (used ? " used" : "") + '" data-a="tile" data-v="' + i + '"' + (used || answered ? " disabled" : "") + ">" + esc(ch) + "</button>"; }).join("") + "</div>";
    }
  }
  return h + "</div>";
}
function autoSpeak() { var q = session && session.items && session.phase === "quiz" && session.items[session.i]; if (q && q.type === "listen") setTimeout(function () { speak(q.w.en); }, 250); }
function answer(ok, chosen) {
  var s = session, q = s.items[s.i];
  if (q.answered !== null) return;
  q.answered = chosen; s.answered++;
  var key = q.w ? q.w.en : q.p.id;
  if (ok) {
    s.correct++; s.combo++; s.best = Math.max(s.best, s.combo);
    var gain = 10 + (s.combo >= 3 ? 5 : 0); s.xp += gain; haptic("ok");
    dialog = { kind: "fb", ok: true, gain: gain, q: q };
  } else {
    s.combo = 0; s.wrong[key] = 1; haptic("bad");
    if (s.kind !== "customs" && !s.retried[key]) {
      s.retried[key] = 1;
      if (q.w) { var other = TYPES.filter(function (t) { return t !== q.type && t !== "spell" && (TTS || t !== "listen"); }); s.items.push(prep({ w: q.w, type: other[Math.floor(Math.random() * other.length)] })); }
      else s.items.push(prep({ p: q.p, type: "order" }));
    }
    dialog = { kind: "fb", ok: false, q: q };
  }
  var say = q.w ? q.w.en : q.p.en;
  if (!ok || q.type !== "listen") speak(say);
  render();
}
function nextItem() {
  dialog = null; session.i++;
  if (session.i >= session.items.length) return finish();
  render(); autoSpeak();
}
function finish() {
  var s = session, d = dayNum();
  var acc = s.answered ? Math.round(s.correct / s.answered * 100) : 0;
  var words = s.kind === "sit" ? s.sit.words : s.words;
  words.forEach(function (w) {
    var p = state.words[w.en] || { b: 0, d: d };
    p.b = s.wrong[w.en] ? 1 : Math.min(p.b + 1, INTERVALS.length - 1);
    p.d = d + INTERVALS[p.b];
    state.words[w.en] = p;
  });
  var bonus = s.kind === "sit" ? 20 : s.kind === "customs" ? 30 : 10;
  var xp = s.xp + bonus, goalNow = addXp(xp), extra = {};
  if (s.kind === "sit") { var prev = state.sit[s.sit.id]; extra.first = !prev; state.sit[s.sit.id] = { best: Math.max(prev ? prev.best : 0, acc) }; }
  if (s.kind === "customs") {
    extra.passed = s.correct >= 12;
    if (extra.passed) state.visas.uk = d; else state.customsTry.uk = d;
    extra.correct = s.correct; extra.total = s.items.length;
  }
  save();
  result = { kind: s.kind, sit: s.sit, xp: xp, acc: acc, best: s.best, goalNow: goalNow, extra: extra, n: words.length };
  session = null; dialog = null; render(); window.scrollTo(0, 0);
  haptic(result.kind === "customs" && !extra.passed ? "bad" : "ok"); countUp();
  if (!REDUCED && !(result.kind === "customs" && !extra.passed)) confetti();
}

/* ---------- итоги ---------- */
function stampHtml(sit) {
  return '<div class="stamp" style="--r:-5deg"><div class="face" style="background:' + SIT_COLORS[sit.index] + '"><span class="glyph">' + UK.flag + '</span><span class="name">' + esc(sit.title) + "</span></div></div>";
}
function renderResult() {
  var r = result, h = '<div class="result">';
  if (r.kind === "customs") {
    if (r.extra.passed) {
      h += "<h1>Виза получена!</h1><p class=\"lead\">" + r.extra.correct + " из " + r.extra.total + " верно. Великобритания пройдена, её виза теперь в вашем паспорте.</p>" +
        '<div class="slam">' + visaHtml(UK, true, -6) + "</div>";
    } else {
      h += '<div style="font-size:60px;line-height:1" aria-hidden="true">🛂</div><h1>Почти получилось</h1><p class="lead">' + r.extra.correct + " из " + r.extra.total + " верно, а нужно 12. Повторите слова, и завтра таможня откроется снова.</p>";
    }
  } else {
    h += '<div style="font-size:60px;line-height:1" aria-hidden="true">' + (r.acc >= 90 ? "🏆" : r.acc >= 60 ? "📬" : "💪") + "</div><h1>" + (r.kind === "sit" ? "Ситуация пройдена!" : "Повторение готово") + '</h1><p class="lead">' +
      (r.kind === "sit" ? esc(r.sit.title) + ". " : r.n + " " + plural(r.n, "слово", "слова", "слов") + ". ") +
      (r.acc >= 90 ? "Отличная работа." : "Слова с ошибками вернутся завтра на повторение.") + "</p>";
  }
  h += '<div class="stats"><div class="stat gold"><b data-count="' + r.xp + '">0</b><span>очков</span></div><div class="stat mint"><b>' + r.acc + '%</b><span>точность</span></div><div class="stat blue"><b>' + r.best + "</b><span>верных подряд</span></div></div>";
  if (r.goalNow) h += '<div class="goal-done"><span aria-hidden="true">🔥</span><div>Цель дня выполнена<br><small style="font-weight:500">Дней подряд: ' + streakNow() + "</small></div></div>";
  if (r.kind === "sit" && r.extra.first) h += '<h3 class="section-t">Новая марка</h3><div class="slam">' + stampHtml(r.sit) + "</div>";
  return h + '<button class="btn" data-a="done">Продолжить</button></div>';
}
function countUp() {
  var el = app.querySelector("[data-count]"); if (!el) return;
  var target = +el.getAttribute("data-count"); if (REDUCED) { el.textContent = target; return; }
  var t0 = performance.now();
  (function step(t) { var k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
}
function confetti() {
  var cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv);
  var dpr = window.devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  var ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  var colors = ["#E0413A", "#2446C8", "#F2B33D", "#139A63", "#FFFFFF"], ps = [];
  for (var i = 0; i < 140; i++) ps.push({ x: innerWidth / 2 + (Math.random() - 0.5) * 60, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: colors[i % colors.length] });
  var t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(function (p) { p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore(); });
    if (t - t0 < 2600 && cv.isConnected) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ---------- всплывающие листы ---------- */
function renderOverlay() {
  if (!dialog) { overlay.innerHTML = ""; return; }
  if (dialog.kind === "fb") {
    var q = dialog.q, en = q.w ? q.w.en : q.p.en, ru = q.w ? q.w.ru : q.p.ru;
    var tail = session && session.kind === "customs" ? "" : "<br><small>Это вернётся в конце, чтобы закрепить.</small>";
    overlay.innerHTML = dialog.ok
      ? '<div class="sheet ok" role="status"><div><h3>' + I.check + "Верно! +" + dialog.gain + '</h3><p><span class="ans">' + esc(en) + "</span> — " + esc(ru) + '</p><button class="btn mint" data-a="continue">Продолжить</button></div></div>'
      : '<div class="sheet bad" role="status"><div><h3>Не совсем</h3><p>Правильно: <span class="ans">' + esc(en) + "</span> — " + esc(ru) + tail + '</p><button class="btn err" data-a="continue">Понятно</button></div></div>';
    var b = overlay.querySelector("[data-a=continue]"); if (b) b.focus({ preventScroll: true });
    return;
  }
  var map = {
    quit: ["Выйти?", session && session.kind === "customs" ? "Проверка не засчитается, попробовать снова можно будет сразу." : "Прогресс этой ситуации не сохранится.", "Выйти", "quit-yes", "Продолжить", "dlg-close"],
    reset: ["Сбросить весь прогресс?", "Выученные слова, очки, серия, марки и визы будут удалены. Отменить это нельзя.", "Сбросить", "reset-yes", "Отмена", "dlg-close"],
    info: [dialog.title, dialog.text, "Понятно", "dlg-close", null, null]
  }[dialog.kind];
  overlay.innerHTML = '<div class="scrim" data-a="dlg-close"><div class="dialog" role="dialog" aria-modal="true" aria-label="' + esc(map[0]) + '"><div><h3>' + esc(map[0]) + "</h3><p>" + esc(map[1]) + '</p><button class="btn' + (map[3] === "dlg-close" ? "" : " err") + '" data-a="' + map[3] + '">' + map[2] + "</button>" +
    (map[4] ? '<button class="btn quiet" data-a="' + map[5] + '">' + map[4] + "</button>" : "") + "</div></div></div>";
}

/* ---------- кнопка «Назад» в Telegram ---------- */
function onBack() {
  if (session || test && !test.done) { dialog = { kind: "quit" }; renderOverlay(); }
  else if (result) { result = null; render(); }
  else if (view === "passport") { view = "map"; render(); }
}
function syncBack() { if (!TG || !tgv("6.1") || !TG.BackButton) return; try { if (session || result || (test && !test.done) || view === "passport") TG.BackButton.show(); else TG.BackButton.hide(); } catch (e) {} }
if (TG && tgv("6.1") && TG.BackButton) { try { TG.BackButton.onClick(onBack); } catch (e) {} }

/* ---------- нажатия ---------- */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  if (el.classList.contains("scrim") && e.target !== el) return;
  var a = el.getAttribute("data-a"), v = el.getAttribute("data-v"), s = session;
  switch (a) {
    case "ob-next": obStep = Math.min(2, obStep + 1); haptic(); render(); break;
    case "ob-goal": state.goal = +v; render(); break;
    case "test-start": startTest(); break;
    case "test-skip": state.onboarded = true; state.placed = state.placed || null; save(); view = "map"; render(); break;
    case "t-yes": {
      var item = C.placement[test.i];
      var pool = shuffle(C.placement.filter(function (x) { return x[0] !== item[0]; })).slice(0, 3).map(function (x) { return x[1]; });
      test.options = shuffle([item[1]].concat(pool)); test.phase = "check"; render(); break;
    }
    case "t-no": testNext(); break;
    case "t-pick": {
      var it = C.placement[test.i]; test.picked = +v;
      var ok = test.options[+v] === it[1];
      if (ok) test.knownEn.push(it[0]);
      haptic(ok ? "ok" : "bad"); render();
      (function (myTest) { setTimeout(function () { if (test === myTest) testNext(); }, 650); })(test);
      break;
    }
    case "test-done": test = null; view = "map"; render(); window.scrollTo(0, 0); break;
    case "retest": startTest(); break;
    case "tab": view = v; haptic(); render(); window.scrollTo(0, 0); break;
    case "sit": startSit(v); break;
    case "customs": startCustoms(); break;
    case "customs-go": s.phase = "quiz"; render(); autoSpeak(); break;
    case "review": startReview(); window.scrollTo(0, 0); break;
    case "next-phase": goNextPhase(); break;
    case "flip": s.flipped = !s.flipped; haptic(); app.querySelector(".card3d").classList.toggle("is-flipped", s.flipped); break;
    case "speak": speak(v); haptic(); break;
    case "learn-next":
      if (s.idx + 1 < s.learn.length) { s.idx++; s.flipped = false; render(); speak(s.learn[s.idx].en); } else goNextPhase();
      break;
    case "d-pick": {
      var cur = s.sit.dialog[s.dstep], choice = s.dopts[+v];
      if (choice === cur.options[0]) {
        s.dlog[s.dstep] = choice; s.dstep++; s.dopts = null; s.dwrong = false; s.dwrongIdx = null;
        haptic("ok"); speak(choice); render();
        var nextStep = s.dstep;
        if (nextStep < s.sit.dialog.length) setTimeout(function () {
          // озвучиваем следующую реплику, только если пользователь ещё на ней
          if (session === s && s.phase === "dialog" && s.dstep === nextStep) speak(s.sit.dialog[nextStep].say);
        }, 1400);
      } else { s.dwrong = true; s.dwrongIdx = +v; haptic("bad"); render(); }
      break;
    }
    case "opt": {
      var q = s.items[s.i], right = q.type === "choose_ru" ? q.w.ru : q.w.en;
      answer(q.options[+v] === right, +v); break;
    }
    case "tile": case "o-tile": {
      var q2 = s.items[s.i];
      if (q2.picked.indexOf(+v) >= 0) break;
      q2.picked.push(+v); haptic(); render();
      var need = q2.type === "order" ? q2.tokens.length : q2.w.en.length;
      if (q2.picked.length === need) setTimeout(function () {
        if (!session || session.items[session.i] !== q2 || q2.picked.length !== need) return;
        var built = q2.type === "order" ? q2.picked.map(function (i) { return q2.tokens[i]; }).join(" ") : q2.picked.map(function (i) { return q2.tiles[i]; }).join("");
        var target = q2.type === "order" ? q2.p.en : q2.w.en;
        var good = built.toLowerCase() === target.toLowerCase();
        answer(good, good);
      }, 200);
      break;
    }
    case "slot": case "o-slot": { var q3 = s.items[s.i]; q3.picked.splice(+v, 1); haptic(); render(); break; }
    case "continue": nextItem(); break;
    case "quit": dialog = { kind: "quit" }; renderOverlay(); break;
    case "quit-yes": session = null; if (test && !test.done) { test = null; if (!state.onboarded) { obStep = 2; view = "ob"; } } dialog = null; render(); break;
    case "done": { var cf = document.getElementById("confetti"); if (cf) cf.remove(); result = null; view = "map"; render(); window.scrollTo(0, 0); break; }
    case "set-goal": state.goal = +v; save(); render(); break;
    case "reset": dialog = { kind: "reset" }; renderOverlay(); break;
    case "reset-yes": state = fresh(); save(); dialog = null; obStep = 0; view = "ob"; render(); break;
    case "dlg-close": dialog = null; renderOverlay(); break;
  }
});
document.addEventListener("keydown", function (e) {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("card3d")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && dialog && dialog.kind !== "fb") { dialog = null; renderOverlay(); }
});

render();
connectRemote();
var splash = document.getElementById("splash");
function hideSplash() { if (!splash.classList.contains("out")) { splash.classList.add("out"); setTimeout(function () { splash.remove(); }, 450); } }
splash.addEventListener("click", hideSplash);
setTimeout(hideSplash, REDUCED ? 0 : 2300);

window.__krug = { get state() { return state; }, get session() { return session; }, get test() { return test; }, dayNum: dayNum, WORDS: WORDS };
})();
</script>
